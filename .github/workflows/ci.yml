# CI for the ebscore kumodev port (plan D24): tests in a conda env from environment.yml, then the Docker stages.
name: ci

on:
  push:
    branches: [kumodev]
  pull_request:
    branches: [kumodev]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install ebscore (non-editable, so missing package data shows up)
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test stage (pytest inside the build env, not shipped)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ebscore:ci
          cache-from: type=gha
      - name: Runtime smoke test
        run: >
          docker run --rm ebscore:ci bash -o pipefail -c
          'id -un && test "$(id -u)" != 0 && ebscore --version && samtools --version | sed -n 1p &&
          mawk -W version 2>&1 | sed -n 1p && ps -o rss= -p $$ && ! command -v pip && ! python -c "import pip" 2>/dev/null'
      # `&&`, not `;`: with `;` only the last command's status counted, so a root user or a missing tool passed.
      # sed -n 1p reads all input: `| head -1` under pipefail can fail with SIGPIPE (exit 141; myCNV run 45291859460).
      - name: Tier-A fixture smoke in the runtime image (image user, then an arbitrary uid)
        run: |
          docker run --rm -v "$PWD/tests/data/plumbing:/data:ro" -v "$PWD/tests/smoke:/smoke:ro" \
            ebscore:ci bash /smoke/smoke_ebscore.sh /data
          docker run --rm --user 4242:4242 -v "$PWD/tests/data/plumbing:/data:ro" -v "$PWD/tests/smoke:/smoke:ro" \
            ebscore:ci bash /smoke/smoke_ebscore.sh /data
      - name: Image size (image list, exact bytes, per layer, /opt/conda inside the container)
        run: |
          docker image ls ebscore:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker image inspect --format 'inspect .Size: {{.Size}} bytes' ebscore:ci
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' ebscore:ci | cut -c1-160
          docker run --rm ebscore:ci du -sh /opt/conda /usr /var
      # Trivy 0.69.3 (the kumo-docker-scientific CI version) as a container; the vuln DB is cached in a volume for
      # the three scans of this job. Gate = library packages, fixed vulns only, HIGH/CRITICAL. Accepted findings go
      # into .trivyignore with a reason (plan 3b/D24).
      - name: Trivy Dockerfile config scan (HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.69.3 \
            config --severity HIGH,CRITICAL --exit-code 1 Dockerfile
      - name: Trivy vulnerability gate (library packages, fixed only, HIGH/CRITICAL)
        run: |
          ignore=()
          if [ -f .trivyignore ]; then ignore=(--ignorefile /src/.trivyignore); fi
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/src:ro \
            -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.69.3 \
            image --scanners vuln --pkg-types library --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            "${ignore[@]}" ebscore:ci
      - name: Trivy report incl. OS packages (informational, never fails)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.69.3 image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 ebscore:ci
