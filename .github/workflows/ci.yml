# CI for the ebscore kumodev port (plan D24): tests in a conda env from environment.yml, then the Docker stages.
name: ci

on:
  push:
    branches: [kumodev]
  pull_request:
    branches: [kumodev]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install ebscore (non-editable, so missing package data shows up)
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test stage (pytest inside the build env, not shipped)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ebscore:ci
          cache-from: type=gha
      - name: Runtime smoke test
        run: >
          docker run --rm ebscore:ci bash -o pipefail -c
          'id -un; test "$(id -u)" != 0; ebscore --version; samtools --version | head -1;
          mawk -W version 2>&1 | head -1; ps -o rss= -p $$'
